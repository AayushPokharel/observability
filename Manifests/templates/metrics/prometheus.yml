global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerting.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8080]
        labels:
          service: gateway

  - job_name: orders
    metrics_path: /metrics
    static_configs:
      - targets: [orders:8080]
        labels:
          service: orders

  - job_name: inventory
    metrics_path: /metrics
    static_configs:
      - targets: [inventory:8080]
        labels:
          service: inventory
