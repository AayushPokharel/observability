services:
  gateway:
    build: ../app
    environment:
      SERVICE_NAME: gateway
      UPSTREAM_URL: http://orders:8080
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: gateway
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=workshop
    ports:
      - "8080:8080"
    networks: [observe]
    depends_on:
      - fluent-bit
      - orders
      - otel-collector
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        tag: "__STUDENT__.gateway"
        fluentd-async: "true"
        fluentd-buffer-limit: "1m"

  orders:
    build: ../app
    environment:
      SERVICE_NAME: orders
      UPSTREAM_URL: http://inventory:8080
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: orders
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=workshop
    networks: [observe]
    depends_on:
      - fluent-bit
      - inventory
      - otel-collector
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        tag: "__STUDENT__.orders"
        fluentd-async: "true"
        fluentd-buffer-limit: "1m"

  inventory:
    build: ../app
    environment:
      SERVICE_NAME: inventory
      UPSTREAM_URL: http://inventory:8080
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: inventory
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=workshop
    networks: [observe]
    depends_on:
      - fluent-bit
      - otel-collector
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        tag: "__STUDENT__.inventory"
        fluentd-async: "true"
        fluentd-buffer-limit: "1m"

  prometheus:
    image: prom/prometheus:v3.9.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      - ../metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../metrics/alerting.yml:/etc/prometheus/alerting.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [observe]
    restart: unless-stopped
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.0.9
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [observe]
    depends_on:
      - prometheus
      - alert-receiver
    restart: unless-stopped
    mem_limit: 512m

  alert-receiver:
    image: mendhak/http-https-echo:42
    environment:
      HTTP_PORT: 8080
      LOG_WITHOUT_REQUEST_BODY: "false"
    networks: [observe]
    restart: unless-stopped
    mem_limit: 64m

  fluent-bit:
    image: fluent/fluent-bit:5.1.2
    volumes:
      - ../logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    ports:
      - "24224:24224"
    networks: [observe]
    depends_on:
      - opensearch
    restart: unless-stopped
    mem_limit: 128m

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks: [observe]
    restart: unless-stopped
    mem_limit: 1g

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    volumes:
      - dashboards-data:/usr/share/opensearch-dashboards/data
    ports:
      - "5601:5601"
    networks: [observe]
    depends_on:
      - opensearch
    restart: unless-stopped
    mem_limit: 512m

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ../traces/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [observe]
    depends_on:
      - jaeger
    restart: unless-stopped
    mem_limit: 256m

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    environment:
      LOG_LEVEL: info
    ports:
      - "16686:16686"
    networks: [observe]
    restart: unless-stopped
    mem_limit: 512m

networks:
  observe:
    name: __COMPOSE_PROJECT_NAME__-full
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  opensearch-data:
  dashboards-data:
